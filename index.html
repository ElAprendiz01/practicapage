<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | App Tuanis</title>
  
  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Estilos propios -->
  <link rel="stylesheet" href="estilos.css">

  <!-- Confetti para celebración -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <!-- Botón flotante para alternar tema -->
  <div style="position: absolute; top: 20px; right: 20px; z-index: 10;">
    <button class="theme-toggle" onclick="toggleTheme()" title="Cambiar tema">
      <i class="fa-solid fa-sun theme-toggle-icon"></i>
    </button>
  </div>

  <main class="auth-wrapper">
    <div class="auth-card glass-panel">
      
      <div class="auth-header">
        <div class="auth-icon">
          <i class="fa-solid fa-bolt"></i>
        </div>
        <h1 class="auth-title">Bienvenido</h1>
        <p class="auth-subtitle">Ingresa a tu cuenta para continuar</p>
      </div>

      <!-- Formulario de Login -->
      <form class="auth-form" id="login-form">
        <div class="input-group">
          <label class="input-label" for="login-email">Correo Electrónico</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input 
              type="email" 
              id="login-email" 
              class="input-field" 
              placeholder="ejemplo@correo.com" 
              required
              autocomplete="email"
            >
          </div>
        </div>

        <div class="input-group">
          <label class="input-label" for="login-password">Contraseña</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input 
              type="password" 
              id="login-password" 
              class="input-field" 
              placeholder="••••••••" 
              required
              autocomplete="current-password"
            >
            <button 
              type="button" 
              class="toggle-password" 
              onclick="togglePasswordVisibility('login-password', 'eye-icon')"
              aria-label="Mostrar u ocultar contraseña"
            >
              <i class="fa-regular fa-eye" id="eye-icon"></i>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="remember-me" checked>
            <span>Recordarme</span>
          </label>
          <a href="javascript:void(0)" onclick="showToast('Usa el botón de cuenta demo abajo 👇', 'info')" style="color: var(--primary); text-decoration: none; font-weight: 500;">¿Olvidaste clave?</a>
        </div>

        <button type="submit" class="btn-primary" id="btn-submit">
          <span>Ingresar</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <!-- Botón de prueba rápida para GitHub Pages -->
      <div class="demo-credentials">
        <div class="demo-text">
          <p><strong>💡 ¿Probando en GitHub Pages?</strong></p>
          <span>Haz clic para autocompletar credenciales</span>
        </div>
        <button type="button" class="btn-secondary" onclick="fillDemoUser()">
          <i class="fa-solid fa-wand-magic-sparkles"></i> Llenar Demo
        </button>
      </div>

    </div>
  </main>

  <!-- Lógica JavaScript -->
  <script src="funciones.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Si ya hay usuario conectado, avisar y facilitar ir directo al home
      const user = getCurrentUser();
      if (user) {
        showToast(`Sesión detectada para ${user.name}. Redirigiendo o puedes cambiar de usuario.`, 'info');
      }

      const form = document.getElementById('login-form');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        const remember = document.getElementById('remember-me').checked;
        
        login(email, password, remember);
      });
    });
  </script>
</body>
</html>
